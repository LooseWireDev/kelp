[versions]
agp = "8.12.3"
kotlin = "2.3.20"
compose-activity = "1.13.0"
kotlinx-coroutines = "1.10.2"
sdk = "0.1.1"

[libraries]
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "compose-activity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.10.0" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Consumed from the included ../light-sdk build via dependencySubstitution;
# versions must match light-sdk/gradle.properties sdkGroup/sdkVersion.
sdk-client = { module = "com.thelightphone:client", version.ref = "sdk" }
sdk-server = { module = "com.thelightphone:server", version.ref = "sdk" }
sdk-shared = { module = "com.thelightphone:shared", version.ref = "sdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.6" }
# Resolved from the included ../light-sdk build (no version).
light-sdk = { id = "com.thelightphone.light-sdk" }
