name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tide
        uses: actions/checkout@v4
        with:
          path: tide

      - name: Checkout companion light-sdk
        uses: actions/checkout@v4
        with:
          repository: LooseWireDev/light-sdk
          ref: codex/tide-official-sdk
          path: light-sdk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + debug assemble
        working-directory: tide
        run: ./gradlew :protocol:test :app:testDebugUnitTest :server:testDebugUnitTest :app:assembleDebug
